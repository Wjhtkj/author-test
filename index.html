<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你与作者的匹配度测试</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">你与作者的匹配度测试</h1>
      <p class="app-sub">20 道题，看看你和作者在多大程度上“同频”。</p>
    </header>

    <!-- 开始页 -->
    <section id="start-screen" class="screen card">
      <p class="lead">
        本测试由 20 道关于生活方式与性格的陈述题组成。请按你的真实情况选择符合程度。
        标准答案只保存在后端数据库里，由服务器独立计算，前端看不到。
      </p>
      <button id="start-btn" class="btn btn-primary" type="button">开始测试</button>
    </section>

    <!-- 答题页 -->
    <section id="quiz-screen" class="screen card hidden">
      <div class="progress">
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="progress-text" class="progress-text">1 / 20</div>
      </div>

      <div class="q-head"><span id="q-type" class="q-type"></span></div>
      <h2 id="question-text" class="question"></h2>

      <div id="options" class="options"></div>

      <div class="quiz-footer">
        <button id="prev-btn" class="btn" type="button">上一题</button>
        <button id="next-btn" class="btn btn-primary" type="button">下一题</button>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="result-screen" class="screen card hidden">
      <p class="result-label">你与作者的匹配度</p>
      <div class="score-circle">
        <span id="match-percent">0</span><i>%</i>
      </div>
      <p id="level-text" class="level"></p>
      <p id="raw-score" class="raw"></p>

      <div class="breakdown">
        <div class="breakdown-col">
          <h3>最一致的 3 题</h3>
          <ul id="top-matches" class="bd-list"></ul>
        </div>
        <div class="breakdown-col">
          <h3>差异最大的 3 题</h3>
          <ul id="top-differences" class="bd-list"></ul>
        </div>
      </div>

      <button id="restart-btn" class="btn btn-primary" type="button">重新测试</button>
    </section>

    <!-- 错误提示 -->
    <p id="error-toast" class="error-toast hidden"></p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
