<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06070e" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="页面不存在。" />
  <title>页面走丢了 · 你与作者的匹配度测试</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 顶层 404.html：让 Cloudflare Pages 对不存在的路径返回真正的 404，
       而不是回退成 SPA 的 index.html（否则 /schema.sql 之类也会返回 200） -->
  <main class="app">
    <section class="screen glass hero">
      <span class="eyebrow">404&nbsp;&nbsp;·&nbsp;&nbsp;NOT FOUND</span>

      <h1 class="hero-title">
        <span class="line">这页<em>走丢</em>了</span>
      </h1>

      <p class="hero-tag">你要找的东西，不在这个次元里。</p>
      <p class="hero-lead">
        可能是链接敲错了，也可能它本来就不打算被公开访问。<br />
        不如回去做套题，看看你和作者到底像不像。
      </p>

      <a class="btn btn-primary btn-lg" href="/" style="text-decoration:none">
        <span>回到测试首页</span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h13M12.5 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>

      <p class="poster-footer">你与作者的匹配度测试 · matching-quiz.pages.dev</p>
    </section>
  </main>
</body>
</html>
